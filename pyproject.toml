[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brickremote"
dynamic = ["version"]
description = "Drive LEGO-compatible Bluetooth motor bricks (JG_JMC / XP Block \"Smart creative module\") from a computer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Strube", email = "surak@surak.eti.br" }]
requires-python = ">=3.10"
dependencies = ["bleak>=0.22"]
keywords = ["bluetooth", "ble", "lego compatible", "building blocks", "motor", "remote control", "xp block", "jg_jmc", "smart creative module", "kids"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://surak.github.io/brickremote/"
Source = "https://github.com/surak/brickremote"
Changelog = "https://github.com/surak/brickremote/blob/main/CHANGELOG.md"

[project.optional-dependencies]
web = ["aiohttp>=3.9"]
test = ["pytest", "ruff"]

[project.scripts]
brickremote = "brickremote.cli:main"

[tool.hatch.version]
path = "src/brickremote/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"docs/translate.py" = ["E501"]
